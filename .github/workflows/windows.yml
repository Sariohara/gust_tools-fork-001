name: Windows

on: [push, pull_request]

env:
  PROJECT_NAME: gust_tools
  FRIENDLY_NAME: Gust Tools

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set version
      shell: bash
      id: set_version
      run: echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      run: msbuild ${{ env.PROJECT_NAME }}.sln /m /p:Configuration=Release /p:Platform=x64 /p:AppVersion=${{ steps.set_version.outputs.version }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.PROJECT_NAME }}
        path: ./x64/Release/*.exe

    - name: Prepare release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        7z a ${{ env.PROJECT_NAME }}.zip .\x64\Release\*.exe *.json README.md LICENSE.txt
        sha256sum ${{ env.PROJECT_NAME }}.zip

    - name: Upload release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body: ${{ env.FRIENDLY_NAME}} ${{ steps.set_version.outputs.version }}
        files: ./*.zip
